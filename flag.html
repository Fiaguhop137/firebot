<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Generator</title>
    <!--All vibes. No code.-->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f11;
            color: #f1f1f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: #1a1616;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #292424;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(45deg, #55aaff, #ff55aa, #aaff55);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #9a8c8c;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #c0b5b5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 1.1rem;
            padding: 12px 16px;
            background-color: #241f1f;
            color: #ffffff;
            border: 2px solid #342d2d;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #fe6760;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #1f1f24;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border: 1px solid #2d2d34;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
        }

        .preview-box svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .placeholder-text {
            color: #575765;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

    </style>
</head>
<body>
<div class="container">
    <h1>Flag Generator Engine</h1>
    <div class="subtitle">By Fiaguhop137</div>
    <div class="input-group">
        <label for="flag-input">Hex Color Code String</label>
        <input type="text" id="flag-input" spellcheck="false" autocomplete="off" value="" placeholder="e.g. aa0055ffaa00>ff00aa55aa00">
    </div>
    <div class="preview-box" id="flag-container">
        <span class="placeholder-text">Enter a valid hex color code to render</span>
    </div>
</div>
<script>
    const inputElement = document.getElementById('flag-input');
    const containerElement = document.getElementById('flag-container');

    function generateFlagSVG(textInput) {
        const parts = textInput.split('>');
        const baseText = parts[0] || '';
        const chevronText = parts[1] || '';

        const baseCode = baseText.toLowerCase().replace(/[^0-9a-f]/g, '');
        const chevronCode = chevronText.toLowerCase().replace(/[^0-9a-f]/g, '');
        
        if (!baseCode || baseCode.length < 6) return '';
        
        let colors = [];
        for (let i = 0; i < baseCode.length - 5; i += 6) {
            let color = baseCode.substring(i, i + 6);
            if (colors.length > 0 && colors[colors.length - 1].color === color) {
                colors[colors.length - 1].count++;
            } else {
                colors.push({ color: color, count: 1 });
            }
        }
        
        if (colors.length === 0) return '';
    
        const HEIGHT = 5040;
        const WIDTH = 6720;
        const totalStripes = Math.floor(baseCode.length / 6);
        
        let svg = `<svg xmlns="http://w3.org" viewBox="0 0 ${WIDTH} ${HEIGHT}" width="100%" height="100%">`;
        svg += `\n<!-- Generated using Fiaguhop137\'s flag generator. Code: ${textInput} -->\n`;
        
        let y = 0;
        const lastIndex = colors.length - 1;
        colors.forEach((stripe, index) => {
            let height = (index === lastIndex) ? (HEIGHT - y) : (stripe.count / totalStripes) * HEIGHT;
            svg += `<rect x="0" y="${y}" width="${WIDTH}" height="${height}" fill="#${stripe.color}"/>\n`;
            y += height;
        });
        
        if (chevronCode && chevronCode.length >= 6) {
            let chevronColors = [];
            for (let i = 0; i < chevronCode.length - 5; i += 6) {
                chevronColors.push(chevronCode.substring(i, i + 6));
            }
            
            let triangleInset = HEIGHT / (2 * chevronColors.length);
            chevronColors.forEach((color, index) => {
                let inset = index * triangleInset;
                let tip = (HEIGHT / 2) - inset;
                svg += `<polygon points="0,${inset} ${tip},${HEIGHT / 2} 0,${HEIGHT - inset}" fill="#${color}"/>\n`;
            });
        }
        
        svg += '</svg>';
        return svg;
    }

    function render() {
        const svgContent = generateFlagSVG(inputElement.value);
        if (svgContent) {
            containerElement.innerHTML = svgContent;
        } else {
            containerElement.innerHTML = `<span class="placeholder-text">Enter valid hex color codes to render</span>`;
        }
    }

    // Live update as the user types
    inputElement.addEventListener('input', render);

    // Initial render call on page load
    render();
</script>
</body>
</html>
